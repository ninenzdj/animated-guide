<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0c" />
<title>我的 · 主页</title>
<style>
/* ===================== 基础 ===================== */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:#ffffff; color:#f2f2f4; overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
:root{
  --bg-default: none;
  --bg:#0a0a0c;
  --txt:#f2f2f4;
  --dim:rgba(255,255,255,.55);
  --dim2:rgba(255,255,255,.38);
  --line:rgba(255,255,255,.08);
  --red:#ec4141;
}
/* 整页铺满窗口：电脑上就是 16:9，手机上就是全屏 */
.app{
  position:relative; width:100%; height:100vh; height:100dvh; overflow:hidden;
  background-color:#0a0a0c;
  background-image:var(--bg-default);
  background-size:cover;
  background-position:center top;
  background-repeat:no-repeat;
}
/* 全背景上压一层暗色，保证文字可读；笔记卡片本身透明，和背景同源 */
.app::before{
  content:""; position:absolute; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(120% 55% at 50% 16%, rgba(0,0,0,0) 0%, rgba(0,0,0,.18) 82%),
    linear-gradient(180deg,
      rgba(6,6,8,.14) 0%,
      rgba(6,6,8,.22) 24%,
      rgba(6,6,8,.32) 52%,
      rgba(6,6,8,.40) 78%,
      rgba(6,6,8,.44) 100%);
}
.scroll{
  position:absolute; inset:0; z-index:1; overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
  padding-bottom:96px;
}
.scroll::-webkit-scrollbar{display:none}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
img{display:block}
/* 内容列：手机上是满宽，桌面居中，不会拉成一条超长横线 */
.wrap{width:100%; max-width:680px; margin:0 auto}
/* ===================== 顶部大图区 ===================== */
.hero{position:relative; padding-bottom:18px}
.topbar{
  position:relative; z-index:2;
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) 18px 0;
}
.tb-btn{width:28px; height:28px; display:grid; place-items:center; color:#fff; opacity:.92}
.tb-btn svg{width:22px; height:22px}
.tb-right{justify-self:end; display:flex; align-items:center; gap:24px}
.topbar .status{justify-self:center}
.status{
  font-size:13px; color:rgba(255,255,255,.9); letter-spacing:.01em;
  display:block; max-width:132px; line-height:1.3;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.status i{font-style:normal; font-size:15px; line-height:1}
/* 资料区 */
.profile{position:relative; z-index:2; text-align:center; padding:16px 20px 0}
.avatar{
  width:92px; height:92px; border-radius:50%; object-fit:cover; margin:0 auto;
  box-shadow:0 0 0 1.5px rgba(255,255,255,.24), 0 12px 26px -12px rgba(0,0,0,.9);
  background:#222;
}
.name-row{display:flex; align-items:center; justify-content:center; gap:8px; margin-top:16px; flex-wrap:wrap}
.name{font-size:19px; font-weight:700; letter-spacing:.01em; word-break:break-word; max-width:100%}
.sign{margin:10px 8px 0; font-size:12px; color:rgba(255,255,255,.62); line-height:1.55}
.badges{
  margin:11px 0 0; font-size:10.5px; color:rgba(255,255,255,.5);
  display:flex; align-items:center; justify-content:center; gap:5px;
}
.badges svg{width:13px; height:13px; opacity:.8}
.stats{
  margin-top:15px; display:flex; align-items:center; justify-content:center; gap:15px;
  font-size:11.5px; color:rgba(255,255,255,.58);
}
.stats b{color:#fff; font-weight:600; font-size:13.5px; margin-right:3px}
/* ===================== 标签页 ===================== */
.tabs{display:flex; justify-content:space-between; align-items:flex-end; padding:20px 16% 0}
.tab{
  position:relative; padding-bottom:9px; font-size:15px; letter-spacing:.02em;
  color:rgba(255,255,255,.42); transition:color .22s;
  min-width:0; max-width:34%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.tab.on{color:#fff; font-weight:700}
.tab.on::after{
  content:""; position:absolute; left:50%; bottom:0; transform:translateX(-50%);
  width:24px; height:2px; border-radius:2px; background:#fff;
}
.panels{position:relative}
.panel{display:none}
.panel.on{display:block; animation:panelIn .34s cubic-bezier(.22,.7,.3,1) both}
@keyframes panelIn{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
.cover{
  position:relative; flex:0 0 auto; width:82px; height:80px;
  border-radius:7px; overflow:hidden; background:#1b1b1f;
}
.cover img{width:100%; height:100%; object-fit:cover}
.cover span{
  position:absolute; left:0; right:0; bottom:0; padding:14px 6px 5px;
  font-size:9.5px; line-height:1.2; color:#fff;
  background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.72));
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.subrow .on{color:#fff; font-weight:600}
/* ---- 通用小标题 ---- */
.sec{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 16px 8px; font-size:12.5px; font-weight:600; color:rgba(255,255,255,.8);
}
.sec span{font-size:11px; font-weight:400; color:var(--dim2)}
/* ---- 播客面板 ---- */
.pod{display:flex; align-items:center; gap:12px; padding:11px 16px}
.pod .t{flex:1 1 auto; min-width:0}
.pod b{display:block; font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pod small{display:block; margin-top:5px; font-size:11px; color:var(--dim2)}
.pod .dur{font-size:11px; color:var(--dim2); margin-left:8px; flex:0 0 auto}
/* ---- 笔记面板 ---- */
.note-card{padding:15px 16px; border-bottom:1px solid rgba(255,255,255,.05)}
.note-card p{margin:0; font-size:13.5px; line-height:1.68; color:rgba(255,255,255,.86)}
/* ===================== 播放条 ===================== */

/* ===================== 底部导航 ===================== */
.bottom{
  position:absolute; left:0; right:0; bottom:0; z-index:9;
  height:calc(60px + env(safe-area-inset-bottom)); padding-bottom:env(safe-area-inset-bottom);
  display:flex; align-items:center; justify-content:space-around;
  background:rgba(10,10,12,.72);
  -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,255,255,.06);
}
.bi{font-size:12.5px; color:rgba(255,255,255,.45); letter-spacing:.04em}
.bi.on{color:#fff; font-weight:700}
.me{position:relative; width:30px; height:30px; border-radius:50%}
.me img{width:100%; height:100%; border-radius:50%; object-fit:cover}
.me i{
  position:absolute; top:-1px; right:-1px; width:7px; height:7px; border-radius:50%;
  background:#fff; box-shadow:0 0 0 2px rgba(10,10,12,.95);
}
/* ===================== 桌面端（16:9 窗口） ===================== */
@media (min-width:760px){
  .topbar{padding:20px 24px 0}
  .profile{padding-top:22px}
  .avatar{width:112px; height:112px}
  .name{font-size:23px}
  .sign{font-size:13px; margin-top:12px}
  .badges{font-size:11.5px; margin-top:13px}
  .stats{font-size:12.5px; margin-top:18px; gap:20px}
  .stats b{font-size:15px}
  .tabs{padding-top:24px}
  .tab{font-size:17px}
  .covers{padding:22px 0 2px; overflow:visible}
  .cover{flex:1 1 0; width:auto; height:auto; aspect-ratio:1}
  .cover span{font-size:11px; padding:18px 8px 7px}
  .subrow{padding:18px 0 0; font-size:13px}
  .liked{padding:20px 0 0}
  .liked img{width:70px; height:70px}
  .lk-t{font-size:15px}
  .lk-s{font-size:11.5px}
  .sec{padding:20px 0 8px; font-size:13px}
  .pod{padding:12px 0}
  .note-card{padding:16px 0}
  .bottom{padding-left:max(0px, calc((100% - 640px) / 2)); padding-right:max(0px, calc((100% - 640px) / 2))}
  .bi{font-size:13.5px}
}
.detail.open{transform:none}
/* ===================== 编辑弹窗 ===================== */
.editor{
  position:fixed; inset:0; z-index:50;
  display:flex; align-items:flex-end; justify-content:center;
  background:rgba(0,0,0,.62);
  -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  transition:opacity .28s ease;
}
.editor.hide{opacity:0; pointer-events:none}
.sheet{
  width:100%; max-width:430px; max-height:88vh; max-height:88dvh;
  display:flex; flex-direction:column;
  background:#151517; border-radius:24px 24px 0 0;
  border-top:1px solid rgba(255,255,255,.09);
  transform:translateY(0);
  transition:transform .32s cubic-bezier(.22,.8,.3,1);
  overflow:hidden;
}
.editor.hide .sheet{transform:translateY(102%)}
@media (min-width:560px){
  .editor{align-items:center}


  .sheet{max-width:420px; max-height:84vh; border-radius:22px; border:1px solid rgba(255,255,255,.1)}}
.sheet-head{padding:18px 20px 6px; flex:0 0 auto}
.sheet-head h2{margin:0; font-size:17px; font-weight:700; letter-spacing:.01em}
.sheet-head p{margin:7px 0 0; font-size:11.5px; color:var(--dim2); line-height:1.6}
#whoLine{margin:6px 0 0; font-size:11px; color:rgba(255,140,120,.9); letter-spacing:.02em}
#whoLine:empty{display:none}
.sheet-body{flex:1 1 auto; overflow-y:auto; padding:8px 20px 4px; scrollbar-width:thin}
.sheet-body::-webkit-scrollbar{width:4px}
.sheet-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18); border-radius:4px}
.group{
  display:flex; align-items:center; gap:8px;
  margin:20px 0 12px; font-size:11.5px; font-weight:600; color:rgba(255,255,255,.72);
  letter-spacing:.06em;
}
.group::before{content:""; width:3px; height:11px; border-radius:2px; background:var(--red)}
.group:first-child{margin-top:6px}
.group span{font-weight:400; color:rgba(255,255,255,.32); letter-spacing:0; font-size:10.5px}
.field{margin-bottom:11px}
.field label{display:block; font-size:10.5px; color:rgba(255,255,255,.4); margin-bottom:6px; letter-spacing:.04em}
.field input,.field textarea{
  width:100%; background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.08);
  border-radius:10px; padding:10px 12px; color:#fff; font:inherit; font-size:13.5px;
  outline:none; transition:border-color .2s, background .2s;
}
.field textarea{resize:none; min-height:60px; line-height:1.5}
.field input:focus,.field textarea:focus{border-color:rgba(255,255,255,.28); background:rgba(255,255,255,.085)}
.field input::placeholder,.field textarea::placeholder{color:rgba(255,255,255,.25)}
.grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.grid4 .field,.grid3 .field,.grid2 .field{margin-bottom:0}
.grid4 input,.grid3 input,.grid2 input{min-width:0}
.avatar-edit{
  display:flex; align-items:center; gap:12px; width:100%;
  padding:10px 12px; border-radius:12px; background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.07);
}
.avatar-edit img{width:52px; height:52px; border-radius:50%; object-fit:cover; background:#222}
.avatar-edit .ae-txt{text-align:left}
.avatar-edit .ae-txt b{display:block; font-size:13px; font-weight:600}
.avatar-edit .ae-txt small{display:block; margin-top:3px; font-size:10.5px; color:var(--dim2)}
.avatar-edit .ae-go{margin-left:auto; font-size:11px; color:rgba(255,255,255,.55)}
.ae-thumb{
  width:52px; height:52px; border-radius:12px; flex:0 0 auto;
  background-image:var(--bg-default); background-size:cover; background-position:center 30%;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12); background-color:#222;
}
/* 播客 / 笔记 的编辑卡片 */
.list-card{
  background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.07);
  border-radius:12px; padding:9px 11px 11px; margin-bottom:9px;
}
.lc-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px}
.lc-idx{font-size:10px; color:rgba(255,255,255,.33); letter-spacing:.06em}
.lc-del{
  width:22px; height:22px; border-radius:50%; display:grid; place-items:center;
  background:rgba(255,255,255,.08); color:rgba(255,255,255,.6);
  font-size:14px; line-height:1;
}
.lc-del:active{background:rgba(236,65,65,.4); color:#fff}
.list-card input,.list-card textarea{
  width:100%; min-width:0; background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08); border-radius:9px;
  padding:9px 11px; color:#fff; font:inherit; font-size:13px; outline:none;
}
.list-card textarea{resize:none; min-height:58px; line-height:1.5}
.list-card input:focus,.list-card textarea:focus{border-color:rgba(255,255,255,.28)}
.list-card input::placeholder,.list-card textarea::placeholder{color:rgba(255,255,255,.22)}
.lc-row{display:flex; gap:8px; margin-top:8px}
.add-row{
  width:100%; height:38px; margin-bottom:4px; border-radius:10px;
  border:1px dashed rgba(255,255,255,.18); color:rgba(255,255,255,.6); font-size:12.5px;
}
.add-row:active{background:rgba(255,255,255,.05)}
/* 笔记配图 */
.note-card .note-pic{width:100%; max-height:260px; object-fit:cover; border-radius:10px; margin-top:11px}
.note-pic-btn.has-img{border-style:solid; border-color:rgba(255,255,255,.1)}
.note-pic-btn.small{width:52px; height:52px; font-size:10px}
.sheet-foot{
  flex:0 0 auto; display:flex; flex-direction:column; gap:9px;
  padding:12px 20px calc(16px + env(safe-area-inset-bottom));
  border-top:1px solid rgba(255,255,255,.07); background:#151517;
}
.foot-row{display:flex; gap:10px}
.btn-export{
  flex:0 0 auto; height:40px; border-radius:12px;
  background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1);
  font-size:13px; color:rgba(255,255,255,.82);
}
.btn-ghost{
  flex:0 0 auto; height:46px; padding:0 18px; border-radius:13px;
  background:rgba(255,255,255,.07); font-size:13px; color:rgba(255,255,255,.8);
}
.btn-main{
  flex:1 1 auto; height:46px; border-radius:13px;
  background:linear-gradient(90deg,#e03434,#ff6a4d);
  font-size:15px; font-weight:700; letter-spacing:.02em;
  box-shadow:0 10px 22px -12px rgba(236,65,65,.9);
}
.btn-main:active{transform:scale(.985)}
/* 保存提示 */
.toast{
  position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom));
  transform:translate(-50%, 10px); z-index:70;
  padding:9px 18px; border-radius:999px; white-space:nowrap;
  background:rgba(26,26,30,.96); border:1px solid rgba(255,255,255,.14);
  color:#fff; font-size:12.5px; opacity:0; pointer-events:none;
  transition:opacity .22s ease, transform .22s ease;
}
.toast.on{opacity:1; transform:translate(-50%, 0)}
/* 存储不可用时的顶部警告 */
.warnbar{
  position:absolute; left:0; right:0; top:0; z-index:45;
  display:flex; align-items:flex-start; gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 12px 9px;
  background:#b3341f; color:#fff; font-size:11.5px; line-height:1.55;
}
.warnbar.hide{display:none}
.warnbar span{flex:1 1 auto}
.warnbar button{flex:0 0 auto; font-size:15px; line-height:1; padding:0 4px; color:#fff; opacity:.8}
/* ===== 新增：图文九宫格 + 九图编辑 ===== */
.img-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:5px; margin-top:11px}
.img-grid img{width:100%; aspect-ratio:1; object-fit:cover; border-radius:6px; display:block}
.feed-empty{padding:44px 16px; text-align:center; font-size:12.5px; color:var(--dim2); line-height:1.8}
.feed-thumbs{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:9px}
.thumb-cell{position:relative; aspect-ratio:1; border-radius:9px; overflow:hidden; background:#222}
.thumb-cell img{width:100%; height:100%; object-fit:cover}
.thumb-del{
  position:absolute; top:3px; right:3px; width:17px; height:17px; border-radius:50%;
  background:rgba(0,0,0,.62); color:#fff; font-size:11px; line-height:17px; text-align:center;
}
.thumb-add{
  aspect-ratio:1; border-radius:9px; border:1px dashed rgba(255,255,255,.18);
  color:rgba(255,255,255,.45); font-size:18px; background:rgba(255,255,255,.04);
}
.lc-note{margin-top:7px; font-size:10px; color:rgba(255,255,255,.3)}
/* ===== 说说卡片：头像 + 昵称 + 仅你可见 + 分享/评论/赞 ===== */
.note-head{display:flex; align-items:flex-start; gap:10px}
.note-av{width:44px; height:44px; border-radius:50%; object-fit:cover; flex:0 0 auto; background:#242428}
.note-who{flex:1 1 auto; min-width:0}
.note-name{display:flex; align-items:center; gap:6px; min-width:0}
.note-name b{font-size:13.5px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.note-name .vip{height:15px; padding:0 5px; font-size:8.5px; border-radius:4px; flex:0 0 auto}
.note-time{margin-top:4px; font-size:10.5px; color:var(--dim2)}
.note-vis{
  flex:0 0 auto; display:inline-flex; align-items:center; gap:3px;
  font-size:10.5px; color:rgba(255,255,255,.36); padding-top:2px;
}
.note-vis svg{width:11px; height:11px}
.note-body{margin-top:10px; padding-left:54px}
.note-card .note-pic{width:100%; height:auto; max-height:none; object-fit:contain; margin-top:11px; border-radius:10px}
.note-card .note-txt{
  margin:0; font-size:13.5px; line-height:1.72; color:rgba(255,255,255,.9);
  white-space:pre-wrap; word-break:break-word;
}
.note-acts{display:flex; align-items:center; gap:30px; margin-top:14px}
.note-acts button{
  display:inline-flex; align-items:center; gap:5px;
  font-size:11.5px; color:rgba(255,255,255,.45); padding:2px 0; transition:color .2s;
}
.note-acts button:hover{color:rgba(255,255,255,.85)}
.note-acts svg{width:15px; height:15px}
@media (min-width:760px){
  .note-card{padding:18px 0 16px}}
/* ===== 点图看大图 ===== */
.note-pic,.img-grid img{cursor:zoom-in}
.viewer{
  position:fixed; inset:0; z-index:60; display:none;
  align-items:center; justify-content:center;
  background:rgba(0,0,0,.95);
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
}
.viewer.on{display:flex; animation:vIn .18s ease}
@keyframes vIn{from{opacity:0} to{opacity:1}}
.viewer img{width:100%; height:100%; object-fit:contain; display:block}
.viewer-hint{
  position:absolute; left:0; right:0; bottom:calc(22px + env(safe-area-inset-bottom));
  text-align:center; font-size:11px; color:rgba(255,255,255,.42); letter-spacing:.04em;
}
/* ===== 进入编辑的密码框 ===== */
.pwd{
  position:fixed; inset:0; z-index:55; display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,.66);
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  padding:24px;
}
.pwd.hide{display:none}
.pwd-box{
  width:100%; max-width:320px; padding:22px 20px 18px;
  background:#17171a; border:1px solid rgba(255,255,255,.1);
  border-radius:18px; box-shadow:0 30px 60px -30px #000;
  animation:vIn .18s ease;
}
.pwd-box h3{margin:0 0 6px; font-size:15.5px; font-weight:700}
.pwd-box p{margin:0 0 14px; font-size:11.5px; color:var(--dim2)}
.pwd-box input{
  width:100%; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
  border-radius:10px; padding:11px 12px; color:#fff; font:inherit; font-size:14px;
  letter-spacing:.12em; outline:none;
}
.pwd-box input:focus{border-color:rgba(255,255,255,.3)}
.pwd-err{min-height:16px; margin-top:7px; font-size:11px; color:#ff6b6b}
.pwd-btns{display:flex; gap:9px; margin-top:12px}
.pwd-btns button{flex:1; height:40px; border-radius:11px; font-size:13.5px}
#pwdCancel{background:rgba(255,255,255,.07); color:rgba(255,255,255,.75)}
#pwdOk{background:linear-gradient(90deg,#e03434,#ff6a4d); color:#fff; font-weight:600}
/* ===================== 开场对话（进主页前） ===================== */
.intro{
  position:absolute; inset:0; z-index:80; background:#fff; color:#000;
  display:flex; flex-direction:column; overflow:hidden;
  transition:opacity .45s ease, transform .5s cubic-bezier(.22,.8,.3,1);
}
.intro.gone{opacity:0; transform:translateY(-100%); pointer-events:none}
.intro-top{flex:0 0 auto; display:flex; align-items:center; gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 6px}
.ic-round{width:38px; height:38px; border-radius:50%; background:#f2f2f7;
  display:grid; place-items:center; color:#000; flex:0 0 auto}
.ic-round svg{width:20px; height:20px}
.intro-who{flex:1 1 auto; display:flex; flex-direction:column; align-items:center; gap:7px; min-width:0}
.intro-ava{width:74px; height:74px; border-radius:50%; object-fit:cover;
  box-shadow:0 2px 12px rgba(0,0,0,.14); background:#eee}
.intro-name{display:inline-flex; align-items:center; gap:3px; max-width:230px;
  background:#fff; border-radius:999px; padding:5px 15px; box-shadow:0 1px 10px rgba(0,0,0,.09);
  font-size:19px; font-weight:700; letter-spacing:-.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.intro-name i{font-style:normal; color:#c7c7cc; font-weight:400}
.intro-sys{flex:0 0 auto; text-align:center; padding:10px 0 4px; font-size:13px; color:#8e8e93; line-height:1.5}
.ic-chat{flex:1 1 auto; overflow-y:auto; padding:8px 16px 96px;
  display:flex; flex-direction:column; gap:8px; scrollbar-width:none}
.ic-chat::-webkit-scrollbar{display:none}
.ic-row{display:flex}
.ic-row.ic-me{justify-content:flex-end}
.ic-bubble{max-width:78%; padding:9px 14px; border-radius:19px; font-size:16.5px; line-height:1.42;
  white-space:pre-wrap; word-break:break-word; animation:icIn .3s ease both}
.ic-row.ic-me .ic-bubble{background:#0b93f6; color:#fff; border-bottom-right-radius:7px}
.ic-row.ic-you .ic-bubble{background:#e9e9eb; color:#000; border-bottom-left-radius:7px}
@keyframes icIn{from{opacity:0; transform:translateY(9px)} to{opacity:1; transform:none}}
.ic-typing{display:flex; gap:4px; padding:13px 16px; background:#e9e9eb;
  border-radius:19px; border-bottom-left-radius:7px; width:max-content}
.ic-typing i{width:7px; height:7px; border-radius:50%; background:#b0b0b5; animation:icDot 1.1s infinite}
.ic-typing i:nth-child(2){animation-delay:.15s}
.ic-typing i:nth-child(3){animation-delay:.3s}
@keyframes icDot{0%,60%,100%{opacity:.35; transform:none} 30%{opacity:1; transform:translateY(-3px)}}
.intro-foot{flex:0 0 auto; text-align:center; padding:0 0 calc(18px + env(safe-area-inset-bottom));
  font-size:12px; color:#8e8e93; opacity:0; transition:opacity .4s}
.intro-foot.on{opacity:1; animation:icPulse 2.2s infinite}
@keyframes icPulse{0%,100%{opacity:.45} 50%{opacity:1}}
/* 聊天里的播放条（压在开场页之上） */
.player{
  position:absolute; left:12px; right:12px; z-index:45;
  bottom:calc(14px + env(safe-area-inset-bottom));
  display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:17px;
  background:rgba(28,28,32,.93); color:#fff;
  -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
  box-shadow:0 14px 34px -14px rgba(0,0,0,.55);
  transform:translateY(26px); opacity:0; pointer-events:none;
  transition:transform .35s cubic-bezier(.22,.8,.3,1), opacity .35s;
}
.player.on{transform:none; opacity:1; pointer-events:auto}
.player.off{opacity:0; pointer-events:none; transform:translateY(30px)}
.pl-disc{width:34px; height:34px; border-radius:50%; flex:0 0 auto; position:relative;
  background:conic-gradient(from 0deg,#3a3a3a,#111 25%,#3a3a3a 50%,#111 75%,#3a3a3a);
  display:grid; place-items:center}
.pl-disc::after{content:""; width:9px; height:9px; border-radius:50%; background:#0b93f6}
.pl-disc.has-img{background:none}
.pl-disc img{width:100%; height:100%; border-radius:50%; object-fit:cover; display:block}
.player.playing .pl-disc:not(.has-img){animation:plSpin 6s linear infinite}
@keyframes plSpin{to{transform:rotate(360deg)}}
.pl-txt{flex:1 1 auto; min-width:0}
.pl-txt b{display:block; font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pl-txt small{display:block; font-size:10.5px; color:rgba(255,255,255,.55); margin-top:2px}
.cover-btn{
  width:100%; height:42px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  gap:8px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08);
  color:rgba(255,255,255,.8); font-size:13px; overflow:hidden;
}
.cover-btn img{width:28px; height:28px; border-radius:6px; object-fit:cover}
.audio-row{display:flex; gap:8px}
.audio-clear{width:66px; flex:0 0 auto; border-radius:10px; background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.08); color:rgba(255,255,255,.8); font-size:12px}
/* 编辑区：开场对话 */
.chat-row{display:flex; align-items:center; gap:8px; margin-bottom:9px}
.side-btn{flex:0 0 auto; width:54px; height:38px; border-radius:10px; font-size:12.5px;
  background:rgba(255,255,255,.12); color:#fff}
.side-btn.is-me{background:#0b93f6}
.chat-row input{flex:1 1 auto; min-width:0; height:38px; padding:0 11px; border-radius:10px;
  background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.08);
  color:#fff; font:inherit; font-size:13px; outline:none}
.chat-row input:focus{border-color:rgba(255,255,255,.28)}
.chat-del{flex:0 0 auto; width:34px; height:38px; border-radius:10px;
  background:rgba(255,90,90,.14); color:#ff8080; font-size:15px; line-height:1}
.chat-add{width:100%; height:38px; margin-top:2px; border-radius:10px;
  border:1px dashed rgba(255,255,255,.22); background:transparent;
  color:rgba(255,255,255,.72); font-size:13px}
.ic-read{align-self:flex-end; font-size:11.5px; color:#8e8e93; margin:-3px 8px 2px 0}
.ic-enter{
  align-self:center; margin:auto 0;
  padding:6px 16px; border-radius:15px;
  background:#e9e9eb; color:#8e8e93;
  font-size:13px; line-height:1.42; font-weight:400;
  animation:icIn .3s ease both;
}
/* 等内容渲染好再显示，避免先闪一下默认内容 */
body.booting .app{opacity:0}
.app{transition:opacity .28s ease}
/* 启动遮罩：先显示一个小转圈，避免打开时一片黑 */
#splash{position:fixed; inset:0; z-index:9999; display:grid; place-items:center;
  background:#fff; transition:opacity .3s ease}
#splash.gone{opacity:0; pointer-events:none}
.sp-ring{width:28px; height:28px; border-radius:50%;
  border:2px solid rgba(0,0,0,.12); border-top-color:rgba(0,0,0,.55);
  animation:spSpin .9s linear infinite}
@keyframes spSpin{to{transform:rotate(360deg)}}
</style>

const clone = o => JSON.parse(JSON.stringify(o));
const POD_COLORS = [
  ["#ff7e5f", "#feb47b"], ["#4b6cb7", "#182848"], ["#834d9b", "#d04ed6"],
  ["#11998e", "#38ef7d"], ["#f7971e", "#ffd200"], ["#3a7bd5", "#00d2ff"]
];

function freshState() {
  const s = clone(DEFAULTS);
  s.pods = clone(DEFAULT_PODS);
  s.music = clone(DEFAULT_MUSIC);
  s.notes = clone(DEFAULT_NOTES);
  return s;
}
let S = freshState();

/* 兜底：3 秒后无论如休都显示 */
setTimeout(() => {
  document.body.classList.remove("booting");
  const sp = document.getElementById("splash");
  if (sp) sp.remove();
}, 3000);

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = v => (String(v).trim() === "" ? "0" : esc(String(v).trim()));

/* ------------- 主页渲染 ------------- */
function imgGrid(imgs) {
  if (!imgs || !imgs.length) return "";
  if (imgs.length === 1) return `<img class="note-pic" src="${imgs[0]}" alt="" loading="lazy" />`;
  return `<div class="img-grid">${imgs.map(src => `<img src="${src}" alt="" loading="lazy" />`).join("")}</div>`;
}

function feedHTML(list, s) {
  const items = list.filter(n => (n.t && n.t.trim()) || (n.imgs && n.imgs.length));
  if (!items.length) return `<p class="feed-empty">还没有内容。<br>点右上角 ⋮ 打开编辑框添加。</p>`;
  return items.map(n => `
    <div class="note-card">
      <div class="note-head">
        <img class="note-av" src="${s.avatar}" alt="" />
        <div class="note-who">
          <div class="note-name"><b>${esc(s.nick)}</b></div>
          <div class="note-time">${esc(n.d)}</div>
        </div>
        <span class="note-vis">${IC.lock}仅你可见</span>
      </div>
      <div class="note-body">
        ${n.t && n.t.trim() ? `<p class="note-txt">${esc(n.t)}</p>` : ""}
        ${imgGrid(n.imgs)}
        <div class="note-acts">
          <button type="button">${IC.share}分享</button>
          <button type="button">${IC.chat}评论</button>
          <button type="button">${IC.heart}赞</button>
        </div>
      </div>
    </div>`).join("");
}

function pageHTML(s) {
  const tabs = s.tabs.map((t, i) =>
    `<button class="tab${i === 0 ? " on" : ""}" data-tab="${i}">${esc(t)}</button>`).join("");

  const podcast = feedHTML(s.pods, s);

  return `
  <section class="hero">
    <div class="wrap">
      <header class="topbar">
        <button class="tb-btn" aria-label="菜单">${IC.menu}</button>
        <button class="status" id="statusChip"><i>+</i>${esc(s.status)}</button>
        <div class="tb-right">
          <button class="tb-btn" aria-label="添加">${IC.plus}</button>
          <button class="tb-btn" aria-label="搜索">${IC.search}</button>
          <button class="tb-btn" id="editEntry" aria-label="更多">${IC.more}</button>
        </div>
      </header>

      <div class="profile">
        <img class="avatar" src="${s.avatar}" alt="头像" />
        <div class="name-row">
          <span class="name">${esc(s.nick)}</span>
        </div>
        <p class="sign">${esc(s.sign)}</p>
        <p class="badges">${IC.medal}<span>${esc(s.badges)}</span></p>
        <div class="stats">
          <span><b>${num(s.follow)}</b>关注</span>
          <span><b>${num(s.fans)}</b>粉丝</span>
          <span><b>Lv.${num(s.level)}</b></span>
          <span><b>${num(s.hours)}</b>小时</span>
        </div>
      </div>
    </div>
  </section>

  <div class="wrap">
    <div class="tabs">${tabs}</div>
    <div class="panels">
      <section class="panel on" data-panel="0">${feedHTML(s.music, s)}</section>
      <section class="panel" data-panel="1">${podcast}</section>
      <section class="panel" data-panel="2">${feedHTML(s.notes, s)}</section>
    </div>
  </div>`;
}

const scrollEl = document.getElementById("scroll");
const editorEl = document.getElementById("editor");

function render() {
  scrollEl.innerHTML = pageHTML(S);
  scrollEl.scrollTop = 0;
  applyBg();
}

/* 背景图：没选就沿用 CSS 里的默认图 */
function applyBg() {
  const app = document.querySelector(".app");
  if (!app) return;
  app.style.backgroundImage = S.bg ? 'url("' + S.bg + '")' : "";
}

function switchTab(i) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === String(i)));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.dataset.panel === String(i)));
}

scrollEl.addEventListener("click", e => {
  const pic = e.target.closest("img.note-pic, .img-grid img");
  if (pic) { openViewer(pic.src); return; }

  const tab = e.target.closest(".tab");
  if (tab) { switchTab(tab.dataset.tab); return; }
  if (e.target.closest("#statusChip")) { askPassword("f-status"); return; }
  if (e.target.closest("#editEntry")) { askPassword(); return; }
});

/* ------------- 弹窗：填充 / 读取 ------------- */
function fillEditor() {
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = v; };
  set("f-nick", S.nick); set("f-sign", S.sign); set("f-badges", S.badges);

/* 把整份内容编码进地址栏（#d=...）——手机浏览器常清本地存储，这条不依赖它 */
const HASH_PREFIX = "#d=";

function encodeState() {
  const wrap = { at: Date.now(), v: window.FILE_VERSION || null, data: S };
  return btoa(unescape(encodeURIComponent(JSON.stringify(wrap))));
}
function decodeState(str) {
  try {
    return JSON.parse(decodeURIComponent(escape(atob(str))));
  } catch (e) { return null; }
}

function saveState() {
  const wrap = { at: Date.now(), v: window.FILE_VERSION || null, data: S };
  let ok = false;
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(wrap));
    ok = true;
  } catch (e) { ok = false; }

  // 兜底：写进地址栏，刷新后原样恢复
  try {
    const b64 = encodeState();
    if (b64.length < 60000) {
      const url = location.pathname + location.search + HASH_PREFIX + b64;
      try { history.replaceState(null, "", url); }
      catch (e) { location.hash = "d=" + b64; }
      ok = true;
    }
  } catch (e) { /* 忽略 */ }

  return ok;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (!obj || typeof obj !== "object") return null;
    // 新格式 {at,data}，旧格式直接是数据
    if (obj.data && typeof obj.data === "object") return { at: obj.at || 0, v: obj.v || null, data: obj.data };
    return { at: 0, data: obj };
  } catch (e) {
    return null;
  }
}

/* ------------- 导出成独立文件（内容写进文件里，不依赖任何存储） ------------- */
function exportHTML() {
  editorEl.classList.add("hide");
  editorEl.style.display = "none";

  function build(audioUrl) {
    const clone = document.documentElement.cloneNode(true);

    const sc = clone.querySelector("#scroll");
    if (sc) sc.innerHTML = "";

    const intro = clone.querySelector("#intro");
    if (intro) { intro.className = "intro"; intro.removeAttribute("style"); }

    const pl = clone.querySelector("#player");
    if (pl) { pl.className = "player"; pl.removeAttribute("style"); }

    const pwdBox = clone.querySelector("#pwd");
    if (pwdBox) pwdBox.className = "pwd hide";

    const ed = clone.querySelector("#editor");
    if (ed) { ed.className = "editor hide"; ed.removeAttribute("style"); }

    const vw = clone.querySelector("#viewer");
    if (vw) vw.className = "viewer";

    // 去掉 DOM 里重复的内联图片，数据已经写进 seed 了
    clone.querySelectorAll("img").forEach(el => el.removeAttribute("src"));
    clone.querySelectorAll("[style]").forEach(el => el.removeAttribute("style"));

    const tst = clone.querySelector("#toast");
    if (tst) tst.remove();

    const payload = { at: Date.now(), data: S };
    if (audioUrl) payload.audio = audioUrl;

    const seed = document.createElement("script");
    seed.type = "application/json";
    seed.id = "seed-data";
    seed.textContent = JSON.stringify(payload).replace(/<\/script/gi, "<\\/script");

    const body = clone.querySelector("body");
    const oldSeed = clone.querySelector("#seed-data");
    if (oldSeed) oldSeed.remove();
    body.insertBefore(seed, body.firstChild);

    const html = "<!DOCTYPE html>" + String.fromCharCode(10) + clone.outerHTML;
    const blob = new Blob([html], { type: "text/html;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "我的主页.html";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);

    const mb = (blob.size / 1048576).toFixed(1);
    toast("已导出（" + mb + "MB），打开新文件音乐也在");
  }

  let finished = false;
  const finish = u => { if (finished) return; finished = true; build(u); };

  if (!S.useLocal) { finish(null); return; }

  toast("正在打包音频…");
  const src = localUrl || embeddedAudio;
  if (src && src.indexOf("data:audio") === 0) { finish(src); return; }

  // 读不出来也要给出文件，最多等 8 秒
  function fromFile() {
    const url = S.audioFile;
    if (!url) { finish(null); return; }
    fetch(url).then(r => r.blob()).then(b => {
      if (!b || b.size < 1000) { finish(null); return; }
      const fr = new FileReader();
      fr.onload = () => finish(fr.result);
      fr.onerror = () => finish(null);
      fr.readAsDataURL(b);
    }).catch(() => finish(null));
  }

  // 读不出来也要给出文件，最多等 12 秒
  const guard = setTimeout(() => finish(null), 12000);
  idbGet("song").then(blob => {
    clearTimeout(guard);
    if (!blob) { fromFile(); return; }
    const fr = new FileReader();
    fr.onload = () => finish(fr.result);
    fr.onerror = () => finish(null);
    fr.readAsDataURL(blob);
  }).catch(() => { clearTimeout(guard); fromFile(); });
}

const playerEl = document.getElementById("player");
const songNameEl = document.getElementById("songName");
const neAudio = document.getElementById("neAudio");

let actx = null, master = null, dly = null, seqTimer = null, step = 0;
let synthOn = false, nePlaying = false, musicOn = false;
let wasPlayingBeforeEdit = false;
const SCALE = [523.25, 587.33, 659.25, 783.99, 880.0, 783.99, 659.25, 587.33];

function initAudio() {
  if (actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  master = actx.createGain();
  master.gain.value = 0.16;
  master.connect(actx.destination);
  dly = actx.createDelay();
  dly.delayTime.value = 0.3;
  const fb = actx.createGain();
  fb.gain.value = 0.28;
  dly.connect(fb); fb.connect(dly); dly.connect(master);
}

function pluck(freq, t, dur, vol) {
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = "sine";
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); g.connect(dly);
  o.start(t); o.stop(t + dur + 0.06);
}

function stepNote() {
  if (!actx) return;
  const t = actx.currentTime + 0.06;
  pluck(SCALE[step % SCALE.length], t, 1.7, 0.5);
  if (step % 4 === 0) pluck(SCALE[0] / 2, t, 2.4, 0.35);
  step++;
}

function startSynth() {
  initAudio();
  if (!actx) return;
  if (actx.state === "suspended") actx.resume();
  if (synthOn) return;
  synthOn = true;
  stepNote();
  seqTimer = setInterval(stepNote, 420);
  refreshPlayerUI();
}

function stopSynth() {
  synthOn = false;
  clearInterval(seqTimer);
  refreshPlayerUI();
}

function neId(str) {
  if (!str) return "";
  const m = String(str).match(/[?&#]id=(\d+)/) || String(str).match(/^\s*(\d{5,})\s*$/);
  return m ? m[1] : "";
}

/* 网易云：直接用官方外链音频地址，可以真正播放/暂停 */
function neSrc(id) {
  return "https://music.163.com/song/media/outer/url?id=" + id + ".mp3";
}

/* ---------- 本地音频（用 IndexedDB 存大文件） ---------- */
let localUrl = null;
let embeddedAudio = null;

function idbOpen() {
  return new Promise((res, rej) => {
    const req = indexedDB.open("lacrime-audio", 1);
    req.onupgradeneeded = () => { req.result.createObjectStore("files"); };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
function idbSet(key, val) {
  return idbOpen().then(db => new Promise((res, rej) => {
    const tx = db.transaction("files", "readwrite");
    tx.objectStore("files").put(val, key);
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error);
  }));
}
function idbGet(key) {
  return idbOpen().then(db => new Promise((res, rej) => {
    const tx = db.transaction("files", "readonly");
    const rq = tx.objectStore("files").get(key);
    rq.onsuccess = () => res(rq.result || null);
    rq.onerror = () => rej(rq.error);
  }));
}
function idbDel(key) {
  return idbOpen().then(db => new Promise((res, rej) => {
    const tx = db.transaction("files", "readwrite");
    tx.objectStore("files").delete(key);
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error);
  }));
}

/* 播放源优先级：本地音频 > 网易云链接 > 内置旋律 */
function currentSrc() {
  if (S.useLocal) {
    const local = localUrl || embeddedAudio || S.audioFile;
    if (local) return local;
  }
  const id = neId(S.song);
  return id ? neSrc(id) : "";
}

function startAudio() {
  const src = currentSrc();
  if (!src) return false;
  stopSynth();
  if (neAudio.src !== src) neAudio.src = src;

  const pr = neAudio.play();

  // 浏览器可能拦下自动播放：4 秒还没动静，就允许下一次点击重试
  setTimeout(() => {
    if (neAudio.paused && !nePlaying) {
      musicOn = false;
      /* 第一次点击就开始放；被暂停后再点也会续上 */
function kickMusic() {
  if (!editorEl.classList.contains("hide")) return;
  if (!musicOn) { startMusic(); return; }
  if (currentSrc() && neAudio.paused) startAudio();
  else if (!currentSrc() && !synthOn) startSynth();
}

document.addEventListener("pointerdown", kickMusic);
    }
  }, 4000);

  if (pr && pr.then) {
    pr.then(() => { nePlaying = true; refreshPlayerUI(); })
      .catch(() => {
        nePlaying = false;
        refreshPlayerUI();
        musicOn = false;
        document.addEventListener("pointerdown", startMusic, { once: true });
      });
  }
  return true;
}

function refreshSongLabel() {
  const name = S.songName;
  if (name) { songNameEl.textContent = name; return; }
  if (S.useLocal && S.audioName) { songNameEl.textContent = S.audioName.replace(/\.[^.]+$/, ""); return; }
  songNameEl.textContent = neId(S.song) ? "网易云歌曲" : "Lacrime";
}

function startMusic() {
  if (musicOn) return;
  musicOn = true;
  playerEl.classList.add("on");
  refreshSongLabel();
  setDisc();
  if (currentSrc()) startAudio();
  else startSynth();
}

document.addEventListener("pointerdown", startMusic, { once: true });

/* 开场自动播放：浏览器允许就直接放，被拦下就等第一次点击 */
window.addEventListener("load", () => {
  setTimeout(() => {
    if (musicOn) return;
    try { startMusic(); } catch (e) {}
    // 内置旋律的音频上下文被挂起时，退回到“第一次点击再播”
    setTimeout(() => {
      if (synthOn && actx && actx.state === "suspended") { stopSynth(); musicOn = false; }
    }, 600);
  }, 500);
});

/* 根据网易云链接自动补全「歌手 - 歌名」和信息 */
function fillSongInfo() {
  const id = neId(S.song);
  if (!id) return;
  const cb = "__mt" + Math.floor(Math.random() * 1e9);
  const el = document.createElement("script");
  let done = false;
  const finish = data => {
    if (done) return;
    done = true;
    delete window[cb];
    if (el.parentNode) el.parentNode.removeChild(el);
    const d = data && data[0];
    if (!d) return;
    const artist = d.artist || d.author || "";
    const nm = d.name || "";
    if (nm) S.songName = artist ? artist + " - " + nm : nm;
    if (!S.cover && d.pic) S.cover = d.pic;
    refreshSongLabel();
    setDisc();
    renderCoverThumb();
    try { saveState(); } catch (e) {}
  };
  window[cb] = finish;
  el.src = "https://api.injahow.cn/meting/?type=song&id=" + id + "&callback=" + cb;
  el.onerror = () => finish(null);
  document.body.appendChild(el);
}

neAudio.addEventListener("error", () => {
  // 音频文件没找到时，自动在 .m4a / .mp3 之间换一次
  const cur = neAudio.getAttribute("src") || "";
  let alt = "";
  if (/\.m4a$/i.test(cur)) alt = cur.replace(/\.m4a$/i, ".mp3");
  else if (/\.mp3$/i.test(cur)) alt = cur.replace(/\.mp3$/i, ".m4a");
  if (alt && !neAudio.dataset.alt) {
    neAudio.dataset.alt = "1";
    neAudio.src = alt;
    neAudio.play().catch(() => {});
    return;
  }
  nePlaying = false;
  refreshPlayerUI();
  const c = neAudio.error && neAudio.error.code;
  if (c === 4) toast("这个音频浏览器解不了（可能是 AVS3/加密格式），换成普通 mp3 就行");
  else if (c === 2 || c === 3) toast("音频文件读取失败，检查一下文件是否完整");
});
neAudio.addEventListener("pause", () => {
  if (neAudio.src) { nePlaying = false; refreshPlayerUI(); }
});

function refreshPlayerUI() {
  const on = currentSrc() ? nePlaying : synthOn;
  playerEl.classList.toggle("playing", on);
}

function pauseMusicForEdit() {
  wasPlayingBeforeEdit = !!synthOn || (!neAudio.paused && !!neAudio.src);
  stopSynth();
  try { neAudio.pause(); } catch (e) {}
  nePlaying = false;
  playerEl.classList.add("off");
  playerEl.style.display = "none";
  refreshPlayerUI();
}

function resumeMusicAfterEdit() {
  playerEl.classList.remove("off");
  playerEl.style.display = "";
  refreshSongLabel();
  renderAudioState();
  if (!wasPlayingBeforeEdit) return;
  wasPlayingBeforeEdit = false;
  if (currentSrc()) startAudio();
  else startSynth();
}

function setDisc() {
  const d = document.getElementById("plDisc");
  if (!d) return;
  if (S.cover) {
    d.innerHTML = '<img src="' + S.cover + '" alt="">';
    d.classList.add("has-img");
  } else {
    d.innerHTML = "";
    d.classList.remove("has-img");
  }
}

function renderCoverThumb() {
  const t = document.getElementById("coverThumb");
  if (!t) return;
  t.innerHTML = S.cover ? '<img src="' + S.cover + '" alt="">' : "选择图片";
}

function renderAudioState() {
  const n = document.getElementById("audioName");
  if (!n) return;
  n.textContent = (S.useLocal && S.audioName) ? S.audioName : "选择音频文件";
}


/* 选本地音频 */
document.getElementById("audioBtn").addEventListener("click", () => {
  document.getElementById("audioPick").click();
});

document.getElementById("audioPick").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  idbSet("song", f).then(() => {
    S.useLocal = true;
    S.audioName = f.name;
    if (localUrl) URL.revokeObjectURL(localUrl);
    localUrl = URL.createObjectURL(f);
    renderAudioState();
    refreshSongLabel();
    if (musicOn) { try { neAudio.pause(); } catch (err) {} nePlaying = false; startAudio(); }
    toast("已导入本地音频：" + f.name);
  }).catch(() => toast("导入失败，换个小一点的文件试试"));
  e.target.value = "";
});

document.getElementById("audioClear").addEventListener("click", () => {
  idbDel("song").then(() => {
    S.useLocal = false;
    S.audioName = "";
    if (localUrl) { URL.revokeObjectURL(localUrl); localUrl = null; }
    try { neAudio.pause(); } catch (e) {}
    nePlaying = false;
    renderAudioState();
    refreshSongLabel();
    refreshPlayerUI();
    toast("已移除本地音频");
  });
});

/* 启动时把之前存的音频读回来 */
idbGet("song").then(blob => {
  if (blob) { localUrl = URL.createObjectURL(blob); refreshPlayerUI(); }
}).catch(() => {});

/* ------------- 开场对话的编辑 ------------- */
function renderChatFields() {
  const box = document.getElementById("chatFields");
  if (!box) return;
  if (!Array.isArray(S.chat) || !S.chat.length) S.chat = clone(DEFAULTS.chat);

  const rows = S.chat.map((m, i) => `
    <div class="chat-row">
      <button class="side-btn ${m.side === "me" ? "is-me" : ""}" type="button" data-side="${i}">
        ${m.side === "me" ? "我" : "对方"}
      </button>
      <input data-chat="${i}" value="${esc(m.text)}" placeholder="说点什么" />
      <button class="chat-del" type="button" data-chat-del="${i}" aria-label="删除这一条">×</button>
    </div>`).join("");

  box.innerHTML = rows +
    '<button class="chat-add" type="button" data-chat-add="1">＋ 添加一条</button>';
}

document.getElementById("chatFields").addEventListener("click", e => {
  const del = e.target.closest("[data-chat-del]");
  if (del) {
    S.chat.splice(Number(del.dataset.chatDel), 1);
    if (!S.chat.length) S.chat.push({ side: "you", text: "" });
    renderChatFields();
    return;
  }

  const add = e.target.closest("[data-chat-add]");
  if (add) {
    if (S.chat.length >= 30) { toast("最多 30 条"); return; }
    const last = S.chat[S.chat.length - 1];
    S.chat.push({ side: last && last.side === "me" ? "you" : "me", text: "" });
    renderChatFields();
    const inputs = document.querySelectorAll('#chatFields input[data-chat]');
    if (inputs.length) inputs[inputs.length - 1].focus();
    return;
  }

  const btn = e.target.closest("[data-side]");
  if (!btn) return;
  const i = Number(btn.dataset.side);
  S.chat[i].side = S.chat[i].side === "me" ? "you" : "me";
  renderChatFields();
});

document.getElementById("chatFields").addEventListener("input", e => {
  const el = e.target;
  if (!el.dataset.chat) return;
  S.chat[Number(el.dataset.chat)].text = el.value;
});

/* ------------- 启动：优先用上次保存的内容 ------------- */
/* 先确认这个环境能不能存东西 */
(function checkStorage() {
  let ok = true;
  try {
    localStorage.setItem("__probe__", "1");
    localStorage.removeItem("__probe__");
  } catch (e) { ok = false; }
  if (ok) return;
  const bar = document.getElementById("warnbar");
  if (!bar) return;
  bar.classList.remove("hide");
  const btn = document.getElementById("warnClose");
  if (btn) btn.addEventListener("click", () => bar.classList.add("hide"));
})();

(function boot() {
  // 内置数据(文件) / 地址栏 / 浏览器存档，三选一
  const cands = [];
  embeddedAudio = null;
  let seedCand = null, seedVer = null;

  const seedEl = document.getElementById("seed-data");
  if (seedEl) {
    try {
      const o = JSON.parse(seedEl.textContent);
      if (o && typeof o.audio === "string" && o.audio.indexOf("data:audio") === 0) embeddedAudio = o.audio;
      const d = (o && o.data) ? o.data : o;
      if (d && typeof d === "object") {
        seedVer = (o && o.v) || null;
        seedCand = { at: (o && o.at) || 0, data: d };
        cands.push(seedCand);
      }
    } catch (e) {}
  }

  if (location.hash.indexOf(HASH_PREFIX) === 0) {
    try {
      const o = decodeState(location.hash.slice(HASH_PREFIX.length));
      if (o) {
        const d = o.data ? o.data : o;
        if (d && typeof d === "object") cands.push({ at: o.at || 0, data: d });
      }
    } catch (e) {}
  }

  const st = loadState();
  if (st && st.data) cands.push(st);

  if (!cands.length) return;

  // 关键：只要文件重新生成过（版本号变了），就用文件里的内容，忽略旧存档
  let chosen;
  if (seedCand && (!st || st.v !== seedVer)) {
    chosen = seedCand;
  } else {
    cands.sort((a, b) => (b.at || 0) - (a.at || 0));
    chosen = cands[0];
  }

  S = Object.assign(freshState(), chosen.data);

  ["pods", "music", "notes"].forEach(k => {
    if (!Array.isArray(S[k])) S[k] = [];
    S[k] = S[k]
      .filter(x => x && typeof x === "object")
      .map(x => ({
        t: typeof x.t === "string" ? x.t : "",
        d: typeof x.d === "string" ? x.d : "",
        imgs: Array.isArray(x.imgs) ? x.imgs.slice(0, 9) : []
      }));
  });
})();

render();
playIntro();
document.body.classList.remove("booting");
(function hideSplash() {
  const sp = document.getElementById("splash");
  if (!sp) return;
  sp.classList.add("gone");
  setTimeout(() => sp.remove(), 450);
})();
if (neId(S.song) && !S.songName) fillSongInfo();
</script>
